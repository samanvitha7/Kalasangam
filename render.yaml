services:
  # Full Stack Service (Frontend + Backend)
  - type: web
    name: kalasangam
    env: node
    plan: free
    buildCommand: npm run build:render
    startCommand: cd server && npm start
    staticPublishPath: ./
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        fromService:
          type: web
          name: kalasangam
          property: port
      - key: BASE_URL_PROD
        value: https://https-kalasangam-app-onrender-com.onrender.com
      - key: BASE_URL_DEV
        value: http://localhost:5173
      # IMPORTANT: Set the following sensitive env vars in Render Dashboard,
      # NOT in source control to avoid public exposure.
      # MONGO_URI
      # JWT_SECRET
      # JWT_EXPIRE
      # SMTP_HOST
      # SMTP_PORT
      # SMTP_EMAIL
      # SMTP_PASSWORD
      # FROM_NAME
      # FROM_EMAIL
      # EVENTBRITE_TOKEN
      # GOOGLE_TRANSLATE_API_KEY
